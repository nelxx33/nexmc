name: Auto Unzip Webstudio Export
on:
  push:
    paths:
      - 'uploads/*.zip' # Triggers only when you drop a zip into the uploads folder

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          # Unzip the file directly into the main repository room
          unzip -o uploads/*.zip -d ./
          
          # Delete the original zip so it doesn't clutter your repo
          rm uploads/*.zip

      - name: Commit extracted files back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated unzip of Webstudio build"
          git push
